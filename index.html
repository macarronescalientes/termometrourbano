<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Subir dos fotos</title>
  <meta name="description" content="Sube dos fotos a la carpeta del proyecto." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Manrope:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <!-- Lectura de EXIF (GPS y fecha) en cliente -->
  <script src="https://cdn.jsdelivr.net/npm/exif-js@2.3.0/exif.js" defer></script>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <header class="hero">
      <h1>Subir dos fotos</h1>
      <p class="subtitle">
        Selecciona dos imágenes. Se reducen en tu dispositivo y se envían a la
        carpeta del proyecto.
      </p>
    </header>

    <section class="slots">
      <!-- Slot 1 -->
      <article class="slot" data-index="0" aria-label="Foto 1">
        <label class="slot-empty">
          <input type="file" accept="image/*" class="slot-input" />
          <span class="slot-plus" aria-hidden="true">+</span>
          <span class="slot-title">Foto 1</span>
          <span class="slot-hint">Toca para seleccionar</span>
        </label>

        <div class="slot-filled" hidden>
          <img class="slot-preview" alt="Vista previa de la foto 1" />
          <div class="slot-info">
            <p class="slot-filename"></p>
            <p class="slot-meta"></p>
          </div>
          <button type="button" class="slot-clear" aria-label="Quitar foto 1">×</button>
        </div>

        <div class="slot-loading" hidden>
          <span class="spinner" aria-hidden="true"></span>
          <span>Procesando…</span>
        </div>
      </article>

      <!-- Slot 2 -->
      <article class="slot" data-index="1" aria-label="Foto 2">
        <label class="slot-empty">
          <input type="file" accept="image/*" class="slot-input" />
          <span class="slot-plus" aria-hidden="true">+</span>
          <span class="slot-title">Foto 2</span>
          <span class="slot-hint">Toca para seleccionar</span>
        </label>

        <div class="slot-filled" hidden>
          <img class="slot-preview" alt="Vista previa de la foto 2" />
          <div class="slot-info">
            <p class="slot-filename"></p>
            <p class="slot-meta"></p>
          </div>
          <button type="button" class="slot-clear" aria-label="Quitar foto 2">×</button>
        </div>

        <div class="slot-loading" hidden>
          <span class="spinner" aria-hidden="true"></span>
          <span>Procesando…</span>
        </div>
      </article>
    </section>

    <button id="upload-btn" class="primary-btn" type="button" disabled>
      Subir fotos
    </button>

    <div id="status" class="status" role="status" aria-live="polite"></div>
  </main>

  <script src="script.js" defer></script>
</body>
</html>
